name: CI

# Runs on every PR and every push to main; deploy workflows can reuse it later via workflow_call.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the run still going for the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails a PR that modifies, deletes or renames a migration already on the base branch.
  # Merged migrations are shared history: fix forward with a new migration instead.
  migrations:
    name: migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so the base branch is there to compare against

      - name: Check existing migrations are untouched
        env:
          BASE_REF: ${{ github.base_ref }} # passed via env, never pasted into the script, to avoid injection
        run: |
          # Three dots: diff from where the PR split off, so migrations added to base since then don't count.
          changed=$(git diff --diff-filter=MDR --name-only "origin/${BASE_REF}...HEAD" -- alembic/versions)
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were modified, deleted or renamed:"
            echo "$changed"
            echo "Add a new migration instead of editing one that has already merged."
            exit 1
          fi
          echo "No existing migrations changed."

  # Does the Python API pass lint, typecheck and tests, and do migrations apply to real Postgres?
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jokebox
          POSTGRES_PASSWORD: jokebox-ci-only # throwaway CI database, not a real secret
          POSTGRES_DB: jokebox
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jokebox:jokebox-ci-only@localhost:5432/jokebox
      TEST_DATABASE_URL: postgresql://jokebox:jokebox-ci-only@localhost:5432/jokebox
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - name: Migrations apply, roll back and re-apply on Postgres
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: Reset the database for tests
        run: uv run alembic downgrade base
      - run: uv run pytest

  # Does the React app typecheck, lint, pass its tests and build?
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
